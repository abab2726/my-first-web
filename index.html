<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HankJOJO的全球个人小站</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
        }
        h1 { color: #2d3436; margin-bottom: 10px; }
        p { color: #636e72; font-size: 16px; line-height: 1.6; }
        .greeting {
            font-size: 24px;
            font-weight: bold;
            color: #6c5ce7;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>你好，世界！</h1>
        <p>这是一个面向全球开放的网站。</p>
        <!-- 下面这行字，你可以随时改成你想对大家说的话 -->
        <div class="greeting">欢迎来到我的个人主页！</div>
    </div>

</body>
</html>
